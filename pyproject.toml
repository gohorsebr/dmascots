[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-mascots"
version = "0.2.0"
description = "Mascots that wander on top of your desktop without stealing focus."
requires-python = ">=3.9"
dependencies = ["PySide6-Essentials>=6.5"]

[project.gui-scripts]
desktop-mascots = "desktop_mascots.app:main"

[tool.setuptools.packages.find]
include = ["desktop_mascots*"]
